<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HNU Attendance System — Register your attendance quickly and easily." />
  <title>HNU Attendance System — Home</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Page-specific styles */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      border: 1px solid rgba(79, 142, 247, 0.25);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-lg);
    }

    .hero-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .btn-home {
      margin-top: var(--space-lg);
    }

    /* ── Today's Attendance Table ── */
    .today-section {
      margin-top: var(--space-xl);
    }

    .today-section h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .today-section h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-glass);
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .attendance-table thead th {
      text-align: left;
      padding: var(--space-sm) var(--space-md);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-glass);
    }

    .attendance-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background var(--transition-fast);
    }

    .attendance-table tbody tr:last-child {
      border-bottom: none;
    }

    .attendance-table tbody tr:hover {
      background: rgba(255,255,255,0.03);
    }

    .attendance-table tbody td {
      padding: var(--space-sm) var(--space-md);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    .attendance-table .emp-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .status-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .status-present   { background: rgba(34,197,94,0.12);  color: #22c55e; }
    .status-late      { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .status-early     { background: rgba(251,146,60,0.12); color: #fb923c; }
    .status-completed { background: rgba(79,142,247,0.12); color: #4f8ef7; }
    .status-absent    { background: rgba(239,68,68,0.12);  color: #ef4444; }

    .table-empty {
      text-align: center;
      padding: var(--space-xl);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .container {
      max-width: 680px;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <div class="card">

        <!-- Logo -->
        <div class="logo-wrapper">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="company-name">HNU</span>
            <span class="company-subtitle">Attendance System</span>
          </div>
        </div>

        <!-- Status badge -->
        <div style="text-align: center; margin-bottom: var(--space-xl);">
          <span class="hero-badge">System Active</span>
        </div>

        <!-- Heading -->
        <h1 style="text-align: center;">Employee Attendance<br>Management</h1>
        <p class="lead" style="text-align: center;">
          Select your name and register your attendance instantly.
        </p>

        <!-- Stats -->
        <div class="stats-row" id="stats-row">
          <div class="stat-item">
            <span class="stat-value" id="stat-employees">—</span>
            <span class="stat-label">Employees</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-checked-in">—</span>
            <span class="stat-label">Checked In</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-completed">—</span>
            <span class="stat-label">Completed</span>
          </div>
        </div>

        <!-- CTA Button -->
        <a href="/check-in" class="btn btn-primary btn-home pulse" id="start-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          Start Attendance
        </a>



      </div>

      <p class="footer">
        Working hours: 08:00 AM – 04:00 PM &nbsp;|&nbsp; &copy; <span id="year"></span> HNU Attendance System
        <br><br>
        <a href="/admin" style="color: var(--text-muted); text-decoration: none; font-size: 0.75rem;">Admin Access</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Format a time string "HH:MM" → "HH:MM AM/PM"
    function to12h(timeStr) {
      if (!timeStr) return '—';
      const [h, m] = timeStr.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hour = h % 12 || 12;
      return `${hour}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function statusClass(status) {
      if (!status) return 'status-absent';
      const map = {
        'Present':    'status-present',
        'Late':       'status-late',
        'Early Leave':'status-early',
        'Completed':  'status-completed',
      };
      return map[status] || 'status-present';
    }

    async function loadAll() {
      try {
        const [empRes, todayRes] = await Promise.all([
          fetch(`${window.API_BASE_URL || ''}/employees`),
          fetch(`${window.API_BASE_URL || ''}/attendance/today`),
        ]);

        const employees = empRes.ok  ? await empRes.json()   : [];
        const today     = todayRes.ok ? await todayRes.json() : [];

        // Stats
        document.getElementById('stat-employees').textContent  = employees.length;
        document.getElementById('stat-checked-in').textContent = today.filter(r => r.check_in).length;
        document.getElementById('stat-completed').textContent  = today.filter(r => r.check_in && r.check_out).length;

      } catch (err) {
        console.error('Failed to load attendance data:', err);
      }
    }

    loadAll();
    setInterval(loadAll, 30000);
  </script>
</body>
</html>
