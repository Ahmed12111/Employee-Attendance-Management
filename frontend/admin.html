<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HNU Attendance System — Admin Dashboard." />
  <title>HNU Attendance System — Admin</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Page-specific styles */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      border: 1px solid rgba(79, 142, 247, 0.25);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-lg);
    }
    
    .container {
      max-width: 500px;
    }

    .admin-icon {
      color: var(--accent);
      margin-bottom: var(--space-md);
      display: flex;
      justify-content: center;
    }

    .btn-download {
      margin-top: var(--space-xl);
      background-color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .btn-download:hover {
      background-color: #16a34a;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
    }
    
    .btn-reset {
      margin-top: var(--space-md);
      background-color: transparent;
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
      width: 100%;
    }

    .btn-reset:hover {
      background-color: rgba(239, 68, 68, 0.1);
      border-color: var(--error);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: var(--space-lg);
      transition: color var(--transition-fast);
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <!-- Back link -->
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Home
      </a>

      <div class="card">
        <!-- Logo -->
        <div class="logo-wrapper">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="company-name">HNU</span>
            <span class="company-subtitle">Admin Dashboard</span>
          </div>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view">
          <h1 style="text-align: center;">Admin Login</h1>
          <p class="lead" style="text-align: center;">Please enter your credentials to access the dashboard.</p>
          
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" style="width: 100%; padding: var(--space-md) var(--space-lg); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; font-size: 1rem;" />
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" style="width: 100%; padding: var(--space-md) var(--space-lg); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; font-size: 1rem;" />
          </div>

          <button class="btn btn-primary" id="login-btn">
            <span class="btn-text">Log In</span>
          </button>
          
          <div id="login-result" class="result-banner"></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" style="display: none;">
          <h1 style="text-align: center;">Export Data</h1>
        <p class="lead" style="text-align: center;">
          Download the automatically generated monthly attendance report in Excel format.
        </p>

        <!-- CTA Button -->
        <a href="/export/excel" class="btn btn-primary btn-download" id="download-btn" download="Attendance.xlsx">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download Monthly Attendance
        </a>

        <!-- Reset Button -->
        <button class="btn btn-reset" id="reset-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Reset All Attendance Data
        </button>

        <div style="text-align: center; margin-top: var(--space-xl);">
          <a href="#" id="logout-btn" style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem;">Log Out</a>
        </div>
        </div>

      </div>

      <p class="footer">
        &copy; <span id="year"></span> HNU Attendance System
      </p>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginResult = document.getElementById('login-result');
    const downloadBtn = document.getElementById('download-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Check if already logged in
    const existingToken = sessionStorage.getItem('adminToken');
    if (existingToken) {
      showDashboard(existingToken);
    }

    function showDashboard(token) {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      // Append token to download link
      downloadBtn.href = `/export/excel?token=${encodeURIComponent(token)}`;
    }

    function showLogin() {
      sessionStorage.removeItem('adminToken');
      dashboardView.style.display = 'none';
      loginView.style.display = 'block';
      usernameInput.value = '';
      passwordInput.value = '';
    }

    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        loginResult.textContent = 'Please enter both username and password.';
        loginResult.className = 'result-banner show error';
        return;
      }

      loginBtn.disabled = true;
      loginResult.className = 'result-banner';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (data.success) {
          sessionStorage.setItem('adminToken', data.token);
          showDashboard(data.token);
        } else {
          loginResult.textContent = data.message || 'Login failed.';
          loginResult.className = 'result-banner show error';
        }
      } catch (err) {
        loginResult.textContent = 'Network error. Could not connect.';
        loginResult.className = 'result-banner show error';
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      showLogin();
    });

    resetBtn.addEventListener('click', async () => {
      const confirmed = confirm("⚠️ WARNING: This will permanently delete ALL attendance records for all employees.\n\nAre you absolutely sure you want to continue?");
      if (!confirmed) return;

      const token = sessionStorage.getItem('adminToken');
      if (!token) {
        showLogin();
        return;
      }

      const originalText = resetBtn.innerHTML;
      resetBtn.innerHTML = 'Resetting...';
      resetBtn.disabled = true;

      try {
        const res = await fetch(`/attendance/reset?token=${encodeURIComponent(token)}`, { method: 'DELETE' });
        
        if (res.status === 401) {
            alert("Session expired. Please log in again.");
            showLogin();
            return;
        }

        const data = await res.json();
        if (data.success) {
          alert("✅ Success: " + data.message);
        } else {
          alert("❌ Error: " + (data.message || "Failed to reset data."));
        }
      } catch (err) {
        alert("❌ Network Error: Could not connect to the server.");
      } finally {
        resetBtn.innerHTML = originalText;
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
