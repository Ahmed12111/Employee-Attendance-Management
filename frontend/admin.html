<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HNU Attendance System — Admin Dashboard." />
  <title>HNU Attendance System — Admin</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Page-specific styles */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      border: 1px solid rgba(79, 142, 247, 0.25);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-lg);
    }
    
    .container {
      max-width: 500px;
    }

    .admin-icon {
      color: var(--accent);
      margin-bottom: var(--space-md);
      display: flex;
      justify-content: center;
    }

    .btn-download {
      margin-top: var(--space-xl);
      background-color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .btn-download:hover {
      background-color: #16a34a;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: var(--space-lg);
      transition: color var(--transition-fast);
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <!-- Back link -->
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Home
      </a>

      <div class="card">
        <!-- Logo -->
        <div class="logo-wrapper">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="company-name">HNU</span>
            <span class="company-subtitle">Admin Dashboard</span>
          </div>
        </div>

        <!-- Heading -->
        <h1 style="text-align: center;">Export Data</h1>
        <p class="lead" style="text-align: center;">
          Download the automatically generated monthly attendance report in Excel format.
        </p>

        <!-- CTA Button -->
        <a href="/export/excel" class="btn btn-primary btn-download" id="download-btn" download="Attendance.xlsx">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download Monthly Attendance
        </a>

      </div>

      <p class="footer">
        &copy; <span id="year"></span> HNU Attendance System
      </p>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
